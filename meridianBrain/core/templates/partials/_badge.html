{# Badge Macro Renders an inline status/priority badge pill. Parameters: text - Badge label text bg
- Background color (e.g. "#dc3545") color - Text color (defaults to "#fff") #} {% macro badge(text,
bg, color) -%}
<span
  style="background: {{ bg }}; color: {{ color if color else '#fff' }}; padding: 2px 8px; border-radius: 3px; font-size: 11px; font-weight: 600;"
  >{{ text }}</span
>
{%- endmacro %}
